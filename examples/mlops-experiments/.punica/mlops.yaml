# MLOps pipeline. Stages run in the order below; a failing stage
# whose onFailure is "stop" ends the run.
version: 1

pipeline:
  # Which engine runs the DAG.
  provider: dvc

stages:
  - id: train
    kind: pipeline
    onFailure: stop
  - id: model
    kind: gate
    capability: mlops.model.evaluate
    onFailure: stop
    input:
      thresholds:
        accuracy: 0.8
